<!DOCTYPE HTML>
<html>
<head>
    <title>Payment Successful - Energy Flow Analysis</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https:; connect-src 'self' http: https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https: fonts.googleapis.com fonts.gstatic.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Load main site CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/navigation.css">
    <link rel="stylesheet" href="assets/css/noscript.css" media="none">
    
    <style>
        /* Success page specific styles */
        body {
            background: #1b1f22;
            position: relative;
            overflow-x: hidden;
            padding-top: 0;
            min-height: 100vh;
        }

        /* Background system */
        #bg {
            -moz-transform: scale(1.0);
            -webkit-transform: scale(1.0);
            -ms-transform: scale(1.0);
            transform: scale(1.0);
            -webkit-backface-visibility: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        #bg:before, #bg:after {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #bg:before {
            -moz-transition: background-color 2.5s ease-in-out;
            -webkit-transition: background-color 2.5s ease-in-out;
            -ms-transition: background-color 2.5s ease-in-out;
            transition: background-color 2.5s ease-in-out;
            -moz-transition-delay: 0.75s;
            -webkit-transition-delay: 0.75s;
            -ms-transition-delay: 0.75s;
            transition-delay: 0.75s;
            background-image: linear-gradient(to top, rgba(19, 21, 25, 0.5), rgba(19, 21, 25, 0.5));
            background-size: auto;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 2;
        }

        #bg:after {
            -moz-transform: scale(1.0825);
            -webkit-transform: scale(1.0825);
            -ms-transform: scale(1.0825);
            transform: scale(1.0825);
            -moz-transition: -moz-transform 0.325s ease-in-out, -moz-filter 0.325s ease-in-out;
            -webkit-transition: -webkit-transform 0.325s ease-in-out, -webkit-filter 0.325s ease-in-out;
            -ms-transition: -ms-transform 0.325s ease-in-out, -ms-filter 0.325s ease-in-out;
            transition: transform 0.325s ease-in-out, filter 0.325s ease-in-out;
            background-image: url("images/bg.jpg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            -moz-filter: blur(0.2rem);
            -webkit-filter: blur(0.2rem);
            -ms-filter: blur(0.2rem);
            filter: blur(0.2rem);
            z-index: 1;
        }

        /* Success container */
        .success-container {
            position: relative;
            z-index: 3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            padding-top: 6rem;
        }

        .success-content {
            background: linear-gradient(135deg, #1b1f22 0%, #2d3748 100%);
            border-radius: 20px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .success-icon {
            font-size: 4rem;
            color: #4CAF50;
            margin-bottom: 1rem;
        }

        .success-title {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .success-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .success-details {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .detail-value {
            font-weight: 600;
            color: #ffffff;
        }

        .continue-button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto 1rem auto;
            width: 100%;
            max-width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            text-decoration: none;
        }

        .continue-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        .back-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1rem;
            margin-top: 2rem;
            display: inline-block;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .success-content {
                padding: 2rem;
                margin: 1rem;
            }
            
            .success-title {
                font-size: 2rem;
            }
            
            .success-subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div id="bg"></div>

    <!-- Success Container -->
    <div class="success-container">
        <div class="success-content">
            <div class="success-icon">✓</div>
            <h1 class="success-title" id="success-title">支付成功！</h1>
            <p class="success-subtitle" id="success-subtitle">恭喜！您已成功解锁能量流分析功能</p>
            
            <div class="success-details">
                <div class="detail-item">
                    <span class="detail-label" id="detail-label-1">订单金额：</span>
                    <span class="detail-value">$0.99</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label" id="detail-label-2">有效期：</span>
                    <span class="detail-value" id="detail-value-2">1年</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label" id="detail-label-3">支付时间：</span>
                    <span class="detail-value" id="detail-value-3">刚刚</span>
                </div>
            </div>
            
            <a href="index.html" class="continue-button" id="continue-button">
                <span id="continue-button-text">开始使用</span>
            </a>
            
            <a href="index.html" class="back-link" id="back-link">← 返回首页</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/navigation-loader.js"></script>
    <script>
        // Success page functionality
        class SuccessPage {
            constructor() {
                this.currentLanguage = 'zh';
                this.init();
            }
            
            init() {
                this.detectLanguage();
                this.updatePageText();
                this.setupPaymentStatus();
                this.updateLinks();
            }
            
            detectLanguage() {
                const urlParams = new URLSearchParams(window.location.search);
                const langParam = urlParams.get('lang');
                if (langParam === 'en') {
                    this.currentLanguage = 'en';
                }
            }
            
            setupPaymentStatus() {
                // Payment status is handled by webhook, no need for sessionStorage
                // Update payment time
                const paymentTime = document.getElementById('detail-value-3');
                if (paymentTime) {
                    const now = new Date();
                    paymentTime.textContent = now.toLocaleString(
                        this.currentLanguage === 'zh' ? 'zh-CN' : 'en-US'
                    );
                }
            }
            
            updateLinks() {
                const continueButton = document.getElementById('continue-button');
                const backLink = document.getElementById('back-link');
                
                if (continueButton) {
                    continueButton.href = `index.html?lang=${this.currentLanguage}`;
                }
                if (backLink) {
                    backLink.href = `index.html?lang=${this.currentLanguage}`;
                }
            }
            
            updatePageText() {
                const translations = {
                    zh: {
                        title: '支付成功！',
                        subtitle: '恭喜！您已成功解锁能量流分析功能。',
                        detail1: '订单金额：',
                        detail2: '有效期：',
                        detail3: '支付时间：',
                        duration: '1年',
                        continueButton: '开始使用',
                        backLink: '← 返回首页'
                    },
                    en: {
                        title: 'Payment Successful!',
                        subtitle: 'Congratulations! You have successfully unlocked energy flow analysis.',
                        detail1: 'Amount:',
                        detail2: 'Duration:',
                        detail3: 'Payment Time:',
                        duration: '1 year',
                        continueButton: 'Start Using',
                        backLink: '← Back to Homepage'
                    }
                };
                
                const t = translations[this.currentLanguage] || translations.zh;
                
                // Update page text
                const title = document.getElementById('success-title');
                const subtitle = document.getElementById('success-subtitle');
                const detail1 = document.getElementById('detail-label-1');
                const detail2 = document.getElementById('detail-label-2');
                const detail3 = document.getElementById('detail-label-3');
                const durationValue = document.getElementById('detail-value-2');
                const continueButton = document.getElementById('continue-button-text');
                const backLink = document.getElementById('back-link');
                
                if (title) title.textContent = t.title;
                if (subtitle) subtitle.textContent = t.subtitle;
                if (detail1) detail1.textContent = t.detail1;
                if (detail2) detail2.textContent = t.detail2;
                if (detail3) detail3.textContent = t.detail3;
                if (durationValue) durationValue.textContent = t.duration;
                if (continueButton) continueButton.textContent = t.continueButton;
                if (backLink) backLink.textContent = t.backLink;
            }
        }

        // Initialize success page
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                new SuccessPage();
            });
        } else {
            new SuccessPage();
        }
    </script>
</body>
</html>
